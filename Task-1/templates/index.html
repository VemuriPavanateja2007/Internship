<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
<div class="container mt-5">

    <h1 class="text-center mb-4">Sales Management System</h1>

    <div class="card p-4 mb-4">
        <h3 class="mb-3">Add Sales Record</h3>

        <form action="/add" method="POST">

            <div class="mb-3">
                <label class="form-label">Product Name</label>
                <input type="text" name="product" class="form-control"
                       placeholder="Enter product name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" name="quantity" class="form-control"
                       min="1" placeholder="Enter quantity" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number" name="price" class="form-control"
                       step="0.01" min="0" placeholder="Enter price" required>
            </div>

            <button type="submit" class="btn btn-primary">Add Sale</button>
        </form>
    </div>

    <div class="card p-4">
        <h3 class="mb-3">Sales Records</h3>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody>
                    {% for sale in sales %}
                    <tr>
                        <td>{{ sale["id"] }}</td>
                        <td>{{ sale["product"] }}</td>
                        <td>{{ sale["quantity"] }}</td>
                        <td>₹{{ "%.2f"|format(sale["price"]) }}</td>
                        <td>₹{{ "%.2f"|format(sale["total"]) }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
